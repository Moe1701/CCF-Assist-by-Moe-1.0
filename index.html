<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCF Assist by Moe</title>
    
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="CCF Assist">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</head>
<body class="bg-white overscroll-none select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const BPM = 110;
        const MS_PER_COMPRESSION = 60000 / BPM; // ~545.45 ms

        // 2000ms = 2 Sekunden Pause für exakt 2 Beatmungshübe (jeweils 1 Sekunde)
        const CPR_MODES = {
            '15:2': { compressions: 15, ventTime: 2000 },
            '30:2': { compressions: 30, ventTime: 2000 },
            'continuous': { compressions: 0, ventTime: 0 }
        };

        const formatTime = (ms) => {
            if (!ms || ms < 0) return "00:00";
            const totalSeconds = Math.floor(ms / 1000);
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        };

        const formatClockTime = (timestamp) => {
            if (!timestamp) return "--:--:--";
            const date = new Date(timestamp);
            return date.toLocaleTimeString('de-DE');
        };

        const App = () => {
            const [onboardingStep, setOnboardingStep] = useState(0); 
            const [isFinished, setIsFinished] = useState(false);  
            const [now, setNow] = useState(() => Date.now());
            
            const [scenarioStartTime, setScenarioStartTime] = useState(null);
            const [blsCheckStartTime, setBlsCheckStartTime] = useState(null);
            const [cprStartTime, setCprStartTime] = useState(null);
            
            const [cprMode, setCprMode] = useState('30:2');
            const [sessions, setSessions] = useState([]);
            const [currentSession, setCurrentSession] = useState(null);
            const [isSoundOn, setIsSoundOn] = useState(false);
            
            const [ineffectiveVents, setIneffectiveVents] = useState(0); 
            const [effectiveVents, setEffectiveVents] = useState(0);     
            
            const [protocolData, setProtocolData] = useState(null);
            const [confirmEnd, setConfirmEnd] = useState(false);

            const audioCtxRef = useRef(null);
            const lastPlayedIdRef = useRef(null);
            const currentSessionRef = useRef(currentSession);
            const isSoundOnRef = useRef(isSoundOn);

            useEffect(() => { currentSessionRef.current = currentSession; }, [currentSession]);
            useEffect(() => { isSoundOnRef.current = isSoundOn; }, [isSoundOn]);

            useEffect(() => {
                return () => {
                    if (audioCtxRef.current && audioCtxRef.current.state !== 'closed') {
                        audioCtxRef.current.close().catch(() => {});
                    }
                };
            }, []);

            const unlockSafariAudio = () => {
                if (!audioCtxRef.current) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) audioCtxRef.current = new AudioCtx();
                }
                if (!audioCtxRef.current) return;

                if (audioCtxRef.current.state === 'suspended') {
                    audioCtxRef.current.resume().catch(() => {});
                }
                try {
                    const ctx = audioCtxRef.current;
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    gain.gain.value = 0;
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.onended = () => {
                        osc.disconnect();
                        gain.disconnect();
                    };
                    osc.start(0);
                    osc.stop(ctx.currentTime + 0.01);
                } catch(e) {}
            };

            const playTone = (type) => {
                if (!audioCtxRef.current) return;
                const ctx = audioCtxRef.current;
                
                if (ctx.state === 'suspended') ctx.resume().catch(() => {});

                try {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    const t = ctx.currentTime;

                    osc.onended = () => {
                        osc.disconnect();
                        gain.disconnect();
                    };

                    if (type === 'compression') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(220, t);
                        gain.gain.setValueAtTime(0.001, t);
                        gain.gain.linearRampToValueAtTime(0.6, t + 0.03); 
                        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2); 
                        osc.start(t);
                        osc.stop(t + 0.21);
                    } else if (type === 'ventilation') {
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(180, t);
                        gain.gain.setValueAtTime(0.001, t);
                        gain.gain.linearRampToValueAtTime(0.5, t + 0.3); 
                        gain.gain.linearRampToValueAtTime(0.001, t + 0.8);   
                        osc.start(t);
                        osc.stop(t + 0.81);
                    }
                } catch (e) {}
            };

            useEffect(() => {
                let interval;
                let lastUiUpdate = 0;

                if (!isFinished) {
                    interval = setInterval(() => {
                        const currentTime = Date.now();

                        // UI-State nur alle 200ms aktualisieren
                        if (currentTime - lastUiUpdate >= 200) {
                            setNow(currentTime);
                            lastUiUpdate = currentTime;
                        }

                        // Audio-Metronom läuft hochpräzise im 25ms-Takt
                        if (onboardingStep === 3 && isSoundOnRef.current && currentSessionRef.current) {
                            const session = currentSessionRef.current;
                            const sessionDuration = Math.max(0, currentTime - session.start);
                            let currentBeatId = null;

                            if (session.mode === 'continuous') {
                                const compIndex = Math.floor(sessionDuration / MS_PER_COMPRESSION);
                                currentBeatId = `cont-c-${compIndex}`;
                                if (currentBeatId !== lastPlayedIdRef.current) {
                                    playTone('compression');
                                    lastPlayedIdRef.current = currentBeatId;
                                }
                            } else {
                                const config = CPR_MODES[session.mode] || CPR_MODES['30:2'];
                                const compTime = config.compressions * MS_PER_COMPRESSION;
                                const cycleTime = compTime + config.ventTime;

                                const cycleIndex = Math.floor(sessionDuration / cycleTime);
                                const remainder = sessionDuration % cycleTime;

                                if (remainder < compTime) {
                                    const compIndex = Math.floor(remainder / MS_PER_COMPRESSION);
                                    currentBeatId = `${cycleIndex}-c-${compIndex}`;
                                    if (currentBeatId !== lastPlayedIdRef.current) {
                                        playTone('compression');
                                        lastPlayedIdRef.current = currentBeatId;
                                    }
                                } else {
                                    const singleVentDuration = config.ventTime / 2; 
                                    const ventIndex = Math.floor((remainder - compTime) / singleVentDuration);
                                    if (ventIndex < 2) {
                                        currentBeatId = `${cycleIndex}-v-${ventIndex}`;
                                        if (currentBeatId !== lastPlayedIdRef.current) {
                                            playTone('ventilation');
                                            lastPlayedIdRef.current = currentBeatId;
                                        }
                                    }
                                }
                            }
                        }
                    }, 25);
                }
                return () => clearInterval(interval);
            }, [onboardingStep, isFinished]);

            const handleScenarioStart = () => {
                const currentTime = Date.now();
                setScenarioStartTime(currentTime);
                setNow(currentTime);
                setOnboardingStep(1);
            };

            const handleBlsCheckStart = () => {
                const currentTime = Date.now();
                setBlsCheckStartTime(currentTime);
                setNow(currentTime);
                setOnboardingStep(2);
            };

            const handleStepBack = () => {
                if (onboardingStep === 1) {
                    setScenarioStartTime(null);
                    setOnboardingStep(0);
                } else if (onboardingStep === 2) {
                    setBlsCheckStartTime(null);
                    setOnboardingStep(1);
                }
            };

            const handleCprStart = () => {
                unlockSafariAudio();
                const currentTime = Date.now();
                setCprStartTime(currentTime);
                setOnboardingStep(3); 
                
                const newSession = { start: currentTime, mode: cprMode };
                setCurrentSession(newSession);
                currentSessionRef.current = newSession; 
                
                lastPlayedIdRef.current = null;
                setNow(currentTime);
            };

            const togglePause = () => {
                unlockSafariAudio();
                setConfirmEnd(false);
                const currentTime = Date.now();
                
                if (currentSessionRef.current) {
                    const sessionToClose = currentSessionRef.current;
                    setSessions(prev => [...prev, { ...sessionToClose, end: currentTime }]);
                    setCurrentSession(null);
                    currentSessionRef.current = null; 
                    lastPlayedIdRef.current = null; 
                } else {
                    const newSession = { start: currentTime, mode: cprMode };
                    setCurrentSession(newSession);
                    currentSessionRef.current = newSession;
                    lastPlayedIdRef.current = null;
                }
                setNow(currentTime);
            };

            const handleModeSwitch = (newMode) => {
                if (newMode === cprMode) return;
                setCprMode(newMode);
                if (currentSessionRef.current) {
                    const currentTime = Date.now();
                    const sessionToClose = currentSessionRef.current;
                    setSessions(prev => [...prev, { ...sessionToClose, end: currentTime, isModeSwitch: true }]);
                    
                    const newSession = { start: currentTime, mode: newMode };
                    setCurrentSession(newSession);
                    currentSessionRef.current = newSession;
                    lastPlayedIdRef.current = null; 
                    setNow(currentTime);
                }
            };

            const toggleSound = () => {
                unlockSafariAudio();
                setIsSoundOn(prev => !prev);
            };

            const handleIneffectiveVent = (e) => {
                e.stopPropagation(); 
                setIneffectiveVents(prev => prev + 1);
            };

            const handleEffectiveVent = (e) => {
                e.stopPropagation(); 
                setEffectiveVents(prev => prev + 1);
            };

            // --- BERECHNUNGEN ---
            const calculateSessionActiveTime = (session, endTime) => {
                if (!session || typeof session.start !== 'number') return 0;
                const duration = Math.max(0, endTime - session.start);
                if (session.mode === 'continuous') return duration;
                
                const config = CPR_MODES[session.mode] || CPR_MODES['30:2'];
                const compTime = config.compressions * MS_PER_COMPRESSION;
                const cycleTime = compTime + config.ventTime;

                const fullCycles = Math.floor(duration / cycleTime);
                const remainder = duration % cycleTime;
                return (fullCycles * compTime) + Math.min(remainder, compTime);
            };

            const scenarioElapsedMs = now && scenarioStartTime ? Math.max(0, now - scenarioStartTime) : 0;
            const blsElapsedMs = now && blsCheckStartTime ? Math.max(0, now - blsCheckStartTime) : 0;
            const cprElapsedMs = now && cprStartTime ? Math.max(0, now - cprStartTime) : 0;

            let currentCcfCpr = 0; 
            let currentCcfScenario = 0; 
            let totalActiveMs = 0;
            let isAutoVentilationPause = false;
            let currentPauseElapsedMs = 0;

            if (onboardingStep === 3 && now && cprStartTime) {
                let activeMsTemp = sessions.reduce((acc, s) => acc + calculateSessionActiveTime(s, s.end), 0);
                
                if (currentSession) {
                    activeMsTemp += calculateSessionActiveTime(currentSession, now);
                    if (currentSession.mode !== 'continuous') {
                        const config = CPR_MODES[currentSession.mode] || CPR_MODES['30:2'];
                        const compTime = config.compressions * MS_PER_COMPRESSION;
                        const cycleTime = compTime + config.ventTime;
                        if (Math.max(0, now - currentSession.start) % cycleTime >= compTime) {
                            isAutoVentilationPause = true;
                        }
                    }
                } else {
                    if (sessions.length > 0) {
                        const lastSessionEnd = sessions[sessions.length - 1]?.end;
                        if (lastSessionEnd) {
                            currentPauseElapsedMs = Math.max(0, now - lastSessionEnd);
                        }
                    }
                }
                
                totalActiveMs = activeMsTemp;
                
                if (cprElapsedMs > 0) currentCcfCpr = Math.min(100, Math.round((totalActiveMs / cprElapsedMs) * 100));
                if (scenarioElapsedMs > 0) currentCcfScenario = Math.min(100, Math.round((totalActiveMs / scenarioElapsedMs) * 100));
            }

            const endScenario = () => {
                const endTime = Date.now();
                let finalSessions = [...sessions];
                
                if (currentSessionRef.current) {
                    finalSessions.push({ ...currentSessionRef.current, end: endTime });
                }
                
                const finalActiveMs = finalSessions.reduce((acc, s) => acc + calculateSessionActiveTime(s, s.end), 0);
                
                const finalScenarioMs = scenarioStartTime ? Math.max(0, endTime - scenarioStartTime) : 0;
                const finalBlsMs = blsCheckStartTime ? Math.max(0, endTime - blsCheckStartTime) : 0;
                const finalCprMs = cprStartTime ? Math.max(0, endTime - cprStartTime) : 0;

                const ccfCprFinal = finalCprMs > 0 ? Math.min(100, Math.round((finalActiveMs / finalCprMs) * 100)) : 0;
                const ccfScenarioFinal = finalScenarioMs > 0 ? Math.min(100, Math.round((finalActiveMs / finalScenarioMs) * 100)) : 0;
                
                const handsOffCprMs = Math.max(0, finalCprMs - finalActiveMs);
                
                const timeToBlsMs = (scenarioStartTime && blsCheckStartTime) ? Math.max(0, blsCheckStartTime - scenarioStartTime) : 0;
                const timeToCompMs = (scenarioStartTime && cprStartTime) ? Math.max(0, cprStartTime - scenarioStartTime) : 0;

                const pauseList = [];
                for (let i = 0; i < finalSessions.length - 1; i++) {
                    if (!finalSessions[i].isModeSwitch) {
                        const pauseStart = finalSessions[i].end;
                        const pauseEnd = finalSessions[i + 1].start;
                        const durationMs = Math.max(0, pauseEnd - pauseStart);
                        if (durationMs >= 500) {
                            pauseList.push({
                                index: pauseList.length + 1,
                                startClock: formatClockTime(pauseStart),
                                durationSec: (durationMs / 1000).toFixed(1),
                                durationMs
                            });
                        }
                    }
                }
                if (!currentSessionRef.current && finalSessions.length > 0) {
                    const lastEnd = finalSessions[finalSessions.length - 1].end;
                    const durationMs = Math.max(0, endTime - lastEnd);
                    if (durationMs >= 500) {
                        pauseList.push({
                            index: pauseList.length + 1,
                            startClock: formatClockTime(lastEnd),
                            durationSec: (durationMs / 1000).toFixed(1),
                            durationMs
                        });
                    }
                }
                const longestPauseSec = pauseList.length > 0 
                    ? (Math.max(...pauseList.map(p => p.durationMs)) / 1000).toFixed(1) 
                    : "0.0";
                const pausesOver10s = pauseList.filter(p => p.durationMs > 10000).length;

                setProtocolData({
                    startDate: new Date(scenarioStartTime || endTime).toLocaleDateString('de-DE'),
                    scenarioStartTimeString: formatClockTime(scenarioStartTime),
                    blsStartTimeString: formatClockTime(blsCheckStartTime),
                    cprStartTimeString: formatClockTime(cprStartTime),
                    endTimeString: formatClockTime(endTime),
                    
                    scenarioTotalElapsed: formatTime(finalScenarioMs),
                    blsTotalElapsed: formatTime(finalBlsMs),
                    cprTotalElapsed: formatTime(finalCprMs),
                    
                    ccfCpr: ccfCprFinal,
                    ccfScenario: ccfScenarioFinal,
                    
                    timeToBlsCheck: formatTime(timeToBlsMs),
                    timeToFirstCompression: formatTime(timeToCompMs),
                    
                    handsOnTime: formatTime(finalActiveMs),
                    handsOffTime: formatTime(handsOffCprMs),
                    
                    pauseList,
                    longestPauseSec,
                    pausesOver10s,
                    
                    ineffectiveVents: ineffectiveVents,
                    effectiveVents: effectiveVents,
                    totalVents: ineffectiveVents + effectiveVents
                });

                setSessions(finalSessions);
                setCurrentSession(null);
                currentSessionRef.current = null;
                setIsSoundOn(false); 
                setConfirmEnd(false);
                setIsFinished(true); 
            };

            const resetApp = () => {
                setOnboardingStep(0);
                setIsFinished(false);
                setScenarioStartTime(null);
                setBlsCheckStartTime(null);
                setCprStartTime(null);
                setSessions([]);
                setCurrentSession(null);
                currentSessionRef.current = null;
                setNow(Date.now());
                setCprMode('30:2');
                setIsSoundOn(false);
                setProtocolData(null);
                setIneffectiveVents(0);
                setEffectiveVents(0);
                setConfirmEnd(false);
                lastPlayedIdRef.current = null;
            };

            const handlePrint = () => {
                window.print();
            };

            // --- RENDER PROTOKOLL SCREEN ---
            if (isFinished && protocolData) {
                return (
                    <div className="min-h-screen bg-gray-50 text-gray-800 flex flex-col items-center py-12 px-6 font-sans w-full">
                        <style>
                            {`
                            @media print {
                                body { background: white !important; }
                                .no-print { display: none !important; }
                                .print-container { box-shadow: none !important; max-width: 100% !important; border: none !important; padding: 0 !important; margin: 0 !important; }
                            }
                            `}
                        </style>

                        <div className="print-container bg-white w-full max-w-2xl rounded-2xl shadow-sm border border-gray-100 p-8 md:p-12">
                            <div className="border-b border-gray-200 pb-6 mb-8 flex justify-between items-end">
                                <div>
                                    <div className="flex items-center gap-2 mb-4 text-red-500">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                                            <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>
                                        </svg>
                                        <span className="text-sm font-medium tracking-wide text-gray-800">CCF Assist</span>
                                    </div>
                                    <h1 className="text-3xl font-light text-gray-900 tracking-wide uppercase mb-2">Reanimationsprotokoll</h1>
                                    <p className="text-gray-400 text-sm tracking-widest uppercase">Einsatzbericht • {protocolData.startDate}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-y-6 gap-x-6 mb-8">
                                <div>
                                    <p className="text-[9px] text-gray-400 tracking-widest uppercase mb-1">1. Szenario Start</p>
                                    <p className="text-lg font-light tabular-nums">{protocolData.scenarioStartTimeString}</p>
                                </div>
                                <div>
                                    <p className="text-[9px] text-gray-400 tracking-widest uppercase mb-1">2. BLS Check</p>
                                    <p className="text-lg font-light tabular-nums">{protocolData.blsStartTimeString}</p>
                                </div>
                                <div>
                                    <p className="text-[9px] text-gray-400 tracking-widest uppercase mb-1">3. Kompression</p>
                                    <p className="text-lg font-light tabular-nums">{protocolData.cprStartTimeString}</p>
                                </div>
                                <div>
                                    <p className="text-[9px] text-gray-400 tracking-widest uppercase mb-1">Einsatzende</p>
                                    <p className="text-lg font-light tabular-nums">{protocolData.endTimeString}</p>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-4 gap-y-6 gap-x-6 mb-8 border-t border-gray-100 pt-6">
                                <div>
                                    <p className="text-[9px] text-gray-400 tracking-widest uppercase mb-1">Gesamtzeit Einsatz</p>
                                    <p className="text-xl font-medium text-gray-800 tabular-nums">{protocolData.scenarioTotalElapsed} <span className="text-xs font-light text-gray-400">min</span></p>
                                </div>
                                <div>
                                    <p className="text-[9px] text-gray-400 tracking-widest uppercase mb-1">Zeit bis BLS Check</p>
                                    <p className="text-xl font-light tabular-nums text-gray-600">{protocolData.timeToBlsCheck} <span className="text-xs text-gray-400">min</span></p>
                                </div>
                                <div>
                                    <p className="text-[9px] text-gray-400 tracking-widest uppercase mb-1">Zeit bis 1. Kompr.</p>
                                    <p className="text-xl font-light tabular-nums text-red-500">{protocolData.timeToFirstCompression} <span className="text-xs text-red-300">min</span></p>
                                </div>
                                <div>
                                    <p className="text-[9px] text-gray-400 tracking-widest uppercase mb-1">Reine CPR Dauer</p>
                                    <p className="text-xl font-medium text-gray-800 tabular-nums">{protocolData.cprTotalElapsed} <span className="text-xs font-light text-gray-400">min</span></p>
                                </div>
                            </div>

                            <div className="mt-4 pt-8 border-t border-gray-100">
                                <h2 className="text-sm font-medium text-gray-900 tracking-widest uppercase mb-6">Qualitätsindikatoren (CPR)</h2>
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                    <div className="bg-green-50/50 border border-green-100 rounded-xl p-4 md:col-span-2">
                                        <p className="text-[10px] text-green-700 tracking-widest uppercase mb-2">CCF (ab 1. Kompression)</p>
                                        <p className={`text-5xl font-light tabular-nums ${protocolData.ccfCpr >= 80 ? 'text-green-600' : 'text-amber-500'}`}>
                                            {protocolData.ccfCpr}<span className="text-2xl">%</span>
                                        </p>
                                        <p className="text-[10px] text-gray-500 mt-2">Klinisch relevanter Hauptwert (Ziel &gt; 80%)</p>
                                    </div>
                                    <div className="bg-gray-50 rounded-xl p-4 md:col-span-2">
                                        <p className="text-[10px] text-gray-500 tracking-widest uppercase mb-2">CCF (ab Szenario Start)</p>
                                        <p className="text-4xl font-light tabular-nums text-gray-700 mt-1">
                                            {protocolData.ccfScenario}<span className="text-xl">%</span>
                                        </p>
                                        <p className="text-[10px] text-gray-400 mt-2">Inkl. Anfahrt/Beurteilungszeit</p>
                                    </div>
                                    <div className="bg-gray-50 rounded-xl p-4 md:col-span-2">
                                        <p className="text-[10px] text-gray-500 tracking-widest uppercase mb-2">Hands-On (Aktiv)</p>
                                        <p className="text-2xl font-light tabular-nums text-gray-800 mt-1">
                                            {protocolData.handsOnTime} <span className="text-sm text-gray-400">min</span>
                                        </p>
                                        <p className="text-[10px] text-gray-400 mt-1 uppercase tracking-wide">Reine Kompressionszeit</p>
                                    </div>
                                    <div className="bg-gray-50 rounded-xl p-4 md:col-span-2">
                                        <p className="text-[10px] text-gray-500 tracking-widest uppercase mb-2">Hands-Off (Pausen in CPR)</p>
                                        <p className="text-2xl font-light tabular-nums text-gray-800 mt-1">
                                            {protocolData.handsOffTime} <span className="text-sm text-gray-400">min</span>
                                        </p>
                                        <p className="text-[10px] text-gray-400 mt-1 uppercase tracking-wide">Pausen & Beatmungen</p>
                                    </div>
                                </div>
                            </div>

                            <div className="mt-8 pt-8 border-t border-gray-100">
                                <h2 className="text-sm font-medium text-gray-900 tracking-widest uppercase mb-6">Pausen-Analyse (Manuelle Hands-Off-Zeiten)</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-4">
                                    <div className="bg-gray-50 border border-gray-100 rounded-xl p-4">
                                        <p className="text-[10px] text-gray-500 tracking-widest uppercase mb-1">Anzahl Pausen</p>
                                        <p className="text-2xl font-light tabular-nums text-gray-800">{protocolData.pauseList.length}</p>
                                    </div>
                                    <div className={`border rounded-xl p-4 ${Number(protocolData.longestPauseSec) > 10 ? 'bg-red-50/50 border-red-100' : 'bg-green-50/50 border-green-100'}`}>
                                        <p className={`text-[10px] tracking-widest uppercase mb-1 ${Number(protocolData.longestPauseSec) > 10 ? 'text-red-600' : 'text-green-700'}`}>Längste Pause</p>
                                        <p className={`text-2xl font-light tabular-nums ${Number(protocolData.longestPauseSec) > 10 ? 'text-red-600' : 'text-green-700'}`}>{protocolData.longestPauseSec} <span className="text-sm">sek</span></p>
                                    </div>
                                    <div className={`border rounded-xl p-4 ${protocolData.pausesOver10s > 0 ? 'bg-red-50/50 border-red-100' : 'bg-gray-50 border-gray-100'}`}>
                                        <p className="text-[10px] text-gray-500 tracking-widest uppercase mb-1">Pausen &gt; 10 Sek.</p>
                                        <p className={`text-2xl font-light tabular-nums ${protocolData.pausesOver10s > 0 ? 'text-red-600 font-normal' : 'text-gray-800'}`}>{protocolData.pausesOver10s}</p>
                                    </div>
                                </div>
                                {protocolData.pauseList.length > 0 && (
                                    <div className="flex flex-wrap gap-2 mt-3">
                                        {protocolData.pauseList.map(p => (
                                            <span key={p.index} className={`text-xs px-3 py-1.5 rounded-lg border tabular-nums ${p.durationMs > 10000 ? 'bg-red-50 border-red-200 text-red-700' : 'bg-gray-50 border-gray-200 text-gray-600'}`}>
                                                #{p.index} ({p.startClock}): <strong>{p.durationSec}s</strong>
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="mt-8 pt-8 border-t border-gray-100">
                                <h2 className="text-sm font-medium text-gray-900 tracking-widest uppercase mb-6">Beatmung (Instruktor-Log)</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-gray-50 border border-gray-100 rounded-xl p-4">
                                        <p className="text-[10px] text-gray-500 tracking-widest uppercase mb-1">Versuche Gesamt</p>
                                        <p className="text-2xl font-light tabular-nums text-gray-800">{protocolData.totalVents}</p>
                                    </div>
                                    <div className="bg-blue-50/50 border border-blue-100 rounded-xl p-4">
                                        <p className="text-[10px] text-blue-600 tracking-widest uppercase mb-1">Davon Effektiv</p>
                                        <p className="text-2xl font-light tabular-nums text-blue-700">{protocolData.effectiveVents}</p>
                                    </div>
                                    <div className="bg-orange-50/50 border border-orange-100 rounded-xl p-4">
                                        <p className="text-[10px] text-orange-600 tracking-widest uppercase mb-1">Davon Ineffektiv</p>
                                        <p className="text-2xl font-light tabular-nums text-orange-700">{protocolData.ineffectiveVents}</p>
                                    </div>
                                </div>
                            </div>

                            <div className="hidden print:block mt-24 pt-8 border-t border-gray-200 text-sm text-gray-400">
                                Generiert durch CCF Assist by Moe • {new Date().toLocaleString('de-DE')}
                            </div>
                        </div>

                        <div className="no-print mt-10 flex flex-col sm:flex-row gap-4 w-full max-w-2xl">
                            <button onClick={handlePrint} className="flex-1 bg-gray-900 text-white py-4 rounded-xl font-medium tracking-wide flex justify-center items-center gap-2 hover:bg-gray-800 transition-colors">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                                Als PDF exportieren
                            </button>
                            <button onClick={resetApp} className="flex-1 bg-white border border-gray-200 text-gray-600 py-4 rounded-xl font-medium tracking-wide hover:bg-gray-50 transition-colors">
                                Neues Szenario starten
                            </button>
                        </div>
                    </div>
                );
            }

            // --- RENDER MAIN APP ---
            return (
                <div className="h-[100dvh] bg-white text-gray-800 flex flex-col font-sans overflow-hidden w-full">
                    <style>
                        {`
                        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap');
                        body { font-family: 'Inter', sans-serif; }
                        button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
                        
                        @keyframes pulse-110-bpm {
                            0% { transform: scale(0.99); box-shadow: 0 0 0 0 rgba(220, 252, 231, 0.55); background-color: #dcfce7; }
                            50% { transform: scale(1.02); box-shadow: 0 0 0 25px rgba(220, 252, 231, 0); background-color: #bbf7d0; }
                            100% { transform: scale(0.99); box-shadow: 0 0 0 0 rgba(220, 252, 231, 0); background-color: #dcfce7; }
                        }
                        .animate-cpr-beat { animation: pulse-110-bpm 545.45ms infinite ease-in-out; }

                        @keyframes breathe-blue {
                            0% { transform: scale(0.97); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); background-color: #3b82f6; }
                            50% { transform: scale(1.03); box-shadow: 0 0 0 30px rgba(59, 130, 246, 0); background-color: #60a5fa; }
                            100% { transform: scale(0.97); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); background-color: #3b82f6; }
                        }
                        .animate-breathe { animation: breathe-blue 1000ms infinite ease-in-out; }
                        `}
                    </style>

                    <header className="w-full shrink-0 flex justify-between items-center px-5 py-3 border-b border-gray-100 no-print">
                        <div className="flex items-center gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" className="h-9 sm:h-10 w-auto">
                                <path d="M40 52C40 52 10 32 10 15c0-12 18-12 30 0 12-12 30-12 30 0 0 17-30 37-30 37z" fill="#dc2626"/>
                                <path d="M0 32h15l6-15 10 32 8-22 8 10h18" stroke="#fca5a5" strokeWidth="3" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
                                <text x="85" y="32" fontFamily="Inter, sans-serif" fontWeight="700" fontSize="24" fill="#1f2937">CCF Assist</text>
                                <text x="86" y="50" fontFamily="Inter, sans-serif" fontWeight="300" fontSize="16" fill="#4b5563">by Moe</text>
                            </svg>
                        </div>

                        {onboardingStep === 3 && (
                            <button 
                                onClick={toggleSound}
                                className={`p-2.5 rounded-full flex items-center justify-center transition-all duration-300 outline-none
                                    ${isSoundOn ? 'bg-gray-100 text-gray-800 shadow-inner' : 'bg-white text-gray-400 border border-gray-100'}`}
                                title="Metronom umschalten"
                            >
                                {isSoundOn ? (
                                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 4L8 8H4v8h4l4 4V4zm7.5 8c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                ) : (
                                    <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                                )}
                            </button>
                        )}
                    </header>

                    <main className="flex-1 flex flex-col items-center justify-between w-full max-w-md mx-auto px-5 py-4 overflow-hidden">
                        
                        {/* --- MULTI-STEP ONBOARDING --- */}
                        {onboardingStep < 3 ? (
                            <div className="flex flex-col items-center justify-center flex-1 text-center w-full">
                                
                                <div className="flex bg-gray-50 rounded-full p-1 mb-8 border border-gray-100 w-full justify-between">
                                    <button onClick={() => handleModeSwitch('15:2')} className={`flex-1 py-2.5 rounded-full text-sm font-semibold tracking-wide transition-all duration-300 ${cprMode === '15:2' ? 'bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] text-red-500' : 'text-gray-400 hover:text-gray-600'}`}>15:2</button>
                                    <button onClick={() => handleModeSwitch('30:2')} className={`flex-1 py-2.5 rounded-full text-sm font-semibold tracking-wide transition-all duration-300 ${cprMode === '30:2' ? 'bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] text-red-500' : 'text-gray-400 hover:text-gray-600'}`}>30:2</button>
                                    <button onClick={() => handleModeSwitch('continuous')} className={`flex-1 py-2.5 rounded-full text-sm font-semibold tracking-wide transition-all duration-300 ${cprMode === 'continuous' ? 'bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] text-red-500' : 'text-gray-400 hover:text-gray-600'}`}>Kontinuierlich</button>
                                </div>

                                {/* STEP 0: Szenario Start */}
                                {onboardingStep === 0 && (
                                    <>
                                        <button 
                                            onClick={handleScenarioStart}
                                            className="px-10 py-6 bg-white border border-red-200 text-red-500 rounded-full text-3xl font-light shadow-[0_4px_20px_rgba(239,68,68,0.08)] active:scale-95 transition-all duration-300 tracking-widest outline-none w-full max-w-[300px]"
                                        >
                                            Szenario Start
                                        </button>
                                        <p className="mt-6 text-gray-500 font-light text-base max-w-xs leading-relaxed">
                                            Tippe auf den Button, sobald das Szenario (Einsatzbeginn) startet.
                                        </p>
                                    </>
                                )}

                                {/* STEP 1: BLS Check */}
                                {onboardingStep === 1 && (
                                    <>
                                        <button 
                                            onClick={handleBlsCheckStart}
                                            className="px-8 py-6 bg-white border border-red-200 text-red-500 rounded-full text-2xl font-light shadow-[0_4px_20px_rgba(239,68,68,0.08)] active:scale-95 transition-all duration-300 tracking-widest outline-none w-full max-w-[330px]"
                                        >
                                            BLS Check gestartet
                                        </button>
                                        <div className="mt-6 flex flex-col items-center">
                                            <p className="text-gray-500 font-light text-sm max-w-xs leading-relaxed mb-4">
                                                Tippe hier, sobald die Patientenbeurteilung (BLS Check) beginnt.
                                            </p>
                                            <p className="text-gray-400 font-medium text-xs uppercase tracking-widest">
                                                Szenario-Zeit läuft
                                            </p>
                                            <p className="text-3xl font-light text-red-400 tabular-nums mt-1">
                                                {formatTime(scenarioElapsedMs)}
                                            </p>
                                            <button onClick={handleStepBack} className="mt-5 text-xs text-gray-400 hover:text-gray-600 uppercase tracking-widest underline underline-offset-4">
                                                ← Schritt zurück
                                            </button>
                                        </div>
                                    </>
                                )}

                                {/* STEP 2: CPR Start */}
                                {onboardingStep === 2 && (
                                    <>
                                        <button 
                                            onClick={handleCprStart}
                                            className="px-6 py-6 bg-white border border-red-200 text-red-500 rounded-full text-xl font-light shadow-[0_4px_20px_rgba(239,68,68,0.08)] active:scale-95 transition-all duration-300 tracking-widest outline-none w-full max-w-[350px]"
                                        >
                                            Thoraxkompressionen gestartet
                                        </button>
                                        <div className="mt-6 flex flex-col items-center">
                                            <p className="text-gray-500 font-light text-sm max-w-xs leading-relaxed mb-4">
                                                Tippe hier bei der ersten Thoraxkompression, um das Metronom zu starten.
                                            </p>
                                            <div className="flex gap-8">
                                                <div className="flex flex-col items-center">
                                                    <p className="text-gray-400 font-medium text-[10px] uppercase tracking-widest">Szenario-Zeit</p>
                                                    <p className="text-2xl font-light text-red-400 tabular-nums mt-1">{formatTime(scenarioElapsedMs)}</p>
                                                </div>
                                                <div className="flex flex-col items-center">
                                                    <p className="text-gray-400 font-medium text-[10px] uppercase tracking-widest">BLS-Dauer</p>
                                                    <p className="text-2xl font-light text-gray-500 tabular-nums mt-1">{formatTime(blsElapsedMs)}</p>
                                                </div>
                                            </div>
                                            <button onClick={handleStepBack} className="mt-5 text-xs text-gray-400 hover:text-gray-600 uppercase tracking-widest underline underline-offset-4">
                                                ← Schritt zurück
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>

                        ) : (
                            // --- ACTIVE / PAUSED SCREEN (STEP 3) ---
                            <div className="flex flex-col items-center justify-between w-full h-full">
                                
                                {/* TOP SECTION: Modus-Wahl & Zeiten */}
                                <div className="w-full flex flex-col items-center shrink-0">
                                    <div className="flex bg-gray-50 rounded-full p-1 mb-4 border border-gray-100 w-full justify-between">
                                        <button onClick={() => handleModeSwitch('15:2')} className={`flex-1 py-2 rounded-full text-xs font-semibold tracking-wider transition-all duration-300 uppercase ${cprMode === '15:2' ? 'bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] text-red-500' : 'text-gray-400'}`}>15:2</button>
                                        <button onClick={() => handleModeSwitch('30:2')} className={`flex-1 py-2 rounded-full text-xs font-semibold tracking-wider transition-all duration-300 uppercase ${cprMode === '30:2' ? 'bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] text-red-500' : 'text-gray-400'}`}>30:2</button>
                                        <button onClick={() => handleModeSwitch('continuous')} className={`flex-1 py-2 rounded-full text-xs font-semibold tracking-wider transition-all duration-300 uppercase ${cprMode === 'continuous' ? 'bg-white shadow-[0_2px_10px_rgba(0,0,0,0.05)] text-red-500' : 'text-gray-400'}`}>Kontin.</button>
                                    </div>

                                    {/* ZEITEN-DASHBOARD: Beide Zeiten klar & groß */}
                                    <div className="w-full grid grid-cols-2 gap-3 bg-gray-50/70 border border-gray-100 rounded-2xl py-3 px-4">
                                        <div className="flex flex-col items-center border-r border-gray-200/70 pr-2">
                                            <span className="text-[10px] text-gray-400 tracking-[0.15em] uppercase font-semibold mb-0.5">Einsatz-Zeit</span>
                                            <span className="text-3xl sm:text-4xl font-light text-gray-600 tabular-nums tracking-tight">
                                                {formatTime(scenarioElapsedMs)}
                                            </span>
                                        </div>
                                        <div className="flex flex-col items-center pl-2">
                                            <span className="text-[10px] text-red-500 tracking-[0.15em] uppercase font-semibold mb-0.5">CPR-Dauer</span>
                                            <span className="text-3xl sm:text-4xl font-normal text-gray-900 tabular-nums tracking-tight">
                                                {formatTime(cprElapsedMs)}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* CENTER SECTION: Kompaktere Hauptkugel + Satelliten-Buttons */}
                                <div className="relative flex justify-center items-center w-full my-auto py-4">
                                    
                                    <button
                                        onClick={handleIneffectiveVent}
                                        className="absolute bottom-1 left-1 sm:left-2 bg-white/95 backdrop-blur border border-orange-200 shadow-[0_6px_20px_rgba(0,0,0,0.07)] rounded-full w-20 h-20 sm:w-24 sm:h-24 flex flex-col items-center justify-center z-20 active:scale-95 transition-all outline-none"
                                    >
                                        <span className="text-[8px] text-orange-500 uppercase tracking-wider font-semibold mb-0.5 text-center leading-tight">Beatmungs-<br/>versuch</span>
                                        <span className="text-2xl font-normal text-gray-800 leading-none tabular-nums">{ineffectiveVents}</span>
                                    </button>

                                    <button 
                                        key={!currentSession ? 'paused' : isAutoVentilationPause ? 'vent' : 'comp'}
                                        onClick={togglePause}
                                        className={`w-56 h-56 sm:w-64 sm:h-64 rounded-full flex flex-col items-center justify-center transition-colors duration-300 ease-in-out outline-none select-none relative z-10
                                            ${!currentSession 
                                                ? 'bg-red-500 text-white scale-100 shadow-[0_10px_35px_rgba(239,68,68,0.35)]'
                                                : isAutoVentilationPause
                                                    ? 'animate-breathe text-white'
                                                    : 'animate-cpr-beat text-green-900' 
                                            }
                                        `}
                                    >
                                        {!currentSession ? (
                                            <>
                                                <span className="text-xl font-bold uppercase tracking-wide mb-0.5">CPR Pause</span>
                                                <span className="text-5xl font-light tabular-nums tracking-tighter mb-1">{formatTime(currentPauseElapsedMs)}</span>
                                                <span className="text-base font-light opacity-90 tabular-nums">{currentCcfCpr}% CCF</span>
                                                <span className="absolute bottom-7 text-[9px] font-medium tracking-widest uppercase opacity-75">
                                                    Weiter drücken
                                                </span>
                                            </>
                                        ) : isAutoVentilationPause ? (
                                            <>
                                                <span className="text-2xl font-medium mb-2 tracking-wide uppercase">2x Beatmung</span>
                                                <span className="text-xl font-light opacity-90 tabular-nums">{currentCcfCpr}% CCF</span>
                                            </>
                                        ) : (
                                            <>
                                                <span className="text-6xl sm:text-7xl font-light tracking-tighter tabular-nums leading-none">{currentCcfCpr}<span className="text-3xl sm:text-4xl">%</span></span>
                                                <span className="text-base font-medium mt-1 opacity-80 tracking-widest uppercase">CCF</span>
                                                <span className="absolute bottom-9 text-[9px] font-medium tracking-widest uppercase opacity-60">
                                                    Pause drücken
                                                </span>
                                            </>
                                        )}
                                    </button>

                                    <button
                                        onClick={handleEffectiveVent}
                                        className="absolute bottom-1 right-1 sm:right-2 bg-white/95 backdrop-blur border border-blue-200 shadow-[0_6px_20px_rgba(0,0,0,0.07)] rounded-full w-20 h-20 sm:w-24 sm:h-24 flex flex-col items-center justify-center z-20 active:scale-95 transition-all outline-none"
                                    >
                                        <span className="text-[8px] text-blue-500 uppercase tracking-wider font-semibold mb-0.5 text-center leading-tight">Effektive<br/>Beatmung</span>
                                        <span className="text-2xl font-normal text-gray-800 leading-none tabular-nums">{effectiveVents}</span>
                                    </button>

                                </div>
                                
                                {/* BOTTOM SECTION: Einsatz beenden */}
                                <div className="w-full flex flex-col items-center shrink-0 pb-1">
                                    {!confirmEnd ? (
                                        <button 
                                            onClick={() => setConfirmEnd(true)}
                                            className="w-full max-w-xs py-3 rounded-full bg-gray-50 border border-gray-200 text-[11px] text-gray-600 active:bg-red-50 active:text-red-500 transition-all uppercase tracking-[0.18em] font-medium"
                                        >
                                            Einsatz beenden & Protokoll
                                        </button>
                                    ) : (
                                        <div className="flex items-center gap-3 w-full max-w-xs">
                                            <button 
                                                onClick={endScenario}
                                                className="flex-1 py-3 rounded-full bg-red-600 text-white text-[11px] uppercase tracking-[0.15em] font-semibold shadow-sm active:bg-red-700 transition-all"
                                            >
                                                Wirklich beenden
                                            </button>
                                            <button 
                                                onClick={() => setConfirmEnd(false)}
                                                className="flex-1 py-3 rounded-full bg-gray-100 text-gray-600 text-[11px] uppercase tracking-[0.15em] font-medium active:bg-gray-200 transition-all"
                                            >
                                                Abbrechen
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
